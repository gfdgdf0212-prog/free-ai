name: Update AI Models

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python update_models.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models.json
          if git diff --staged --quiet; then
            echo "Изменений в models.json нет, коммит не нужен."
          else
            git commit -m "Auto-update: актуализация списка бесплатных моделей"
            git push || { echo "PUSH FAILED: проверьте Workflow permissions в настройках репозитория (должно быть Read and write)."; exit 1; }
          fi
