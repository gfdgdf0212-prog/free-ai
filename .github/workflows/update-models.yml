name: Update AI Models

on:
  schedule:
    - cron: '0 */12 * * *'  # Запуск каждые 12 часов
  workflow_dispatch:        # Возможность запустить вручную кнопкой

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python update_models.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: актуализация списка бесплатных моделей"
          git push
